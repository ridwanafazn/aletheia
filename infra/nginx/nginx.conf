worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
  }

  log_format json_escape escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"correlation_id":"$correlation_id",'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';

  access_log /var/log/nginx/access.log json_escape;

  upstream governance_upstream {
    least_conn;
    server governance-service:4001 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  upstream claims_upstream {
    least_conn;
    server claims-service:4002 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  upstream payroll_upstream {
    least_conn;
    server payroll-service:4003 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  upstream worker_upstream {
    least_conn;
    server analytics-worker-go:4004 max_fails=3 fail_timeout=10s;
    keepalive 8;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Correlation-Id $correlation_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 8s;
  proxy_send_timeout 8s;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    location /api/v1/auth/ {
      proxy_pass http://governance_upstream;
    }

    location /api/v1/policies {
      proxy_pass http://governance_upstream;
    }

    location /api/v1/audit-logs {
      proxy_pass http://governance_upstream;
    }

    location /api/v1/claims {
      proxy_pass http://claims_upstream;
    }

    location /api/v1/employees {
      proxy_pass http://payroll_upstream;
    }

    location /api/v1/sales-achievements {
      proxy_pass http://payroll_upstream;
    }

    location /api/v1/payroll {
      proxy_pass http://payroll_upstream;
    }

    location /api/v1/payslips {
      proxy_pass http://payroll_upstream;
    }

    location /api/v1/reports {
      proxy_pass http://payroll_upstream;
    }

    location /internal/v1/qstash/ {
      proxy_pass http://worker_upstream;
    }

    location / {
      return 404;
    }
  }
}
