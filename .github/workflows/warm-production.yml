name: Warm Production

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-production
  cancel-in-progress: true

jobs:
  warm:
    name: Wake Render and edge services
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping health endpoints
        run: |
          for url in \
            https://aletheia-edge.ridwanafazn.workers.dev/healthz \
            https://aletheia-governance.onrender.com/healthz \
            https://aletheia-claims.onrender.com/healthz \
            https://aletheia-payroll.onrender.com/healthz \
            https://aletheia-worker-zjnt.onrender.com/healthz; do
            echo "Warming ${url}"
            curl -fsS --retry 1 --retry-delay 5 --max-time 120 "${url}" >/dev/null || true
          done
